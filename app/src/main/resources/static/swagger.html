<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACMEmailtrap API — Swagger UI</title>
    <!-- Assets served from the jar (webjar), no CDN. -->
    <link rel="stylesheet" href="/webjars/swagger-ui/5.32.8/swagger-ui.css" />
    <style>
      /* ACMEsoftware portal header — self-contained (no CDN), mirrors the brand kit. */
      :root { --ink: #141414; --paper: #f5f4f0; --hr: #f6be00; } /* brand: bar #141414, accent yellow */
      body { margin: 0; background: #fff; }
      nav.portal-nav {
        display: flex; align-items: center; gap: 20px;
        background: var(--ink); height: 60px; padding: 0 24px;
        font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      nav.portal-nav .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; margin-right: 6px; }
      nav.portal-nav .logo { display: block; flex: none; height: 24px; }
      nav.portal-nav .wm { display: flex; align-items: center; }
      nav.portal-nav .wm b { font-size: 15px; letter-spacing: -0.04em; color: var(--paper); font-weight: 800; }
      nav.portal-nav .nav-links { display: flex; align-items: center; gap: 20px; flex: 1; }
      nav.portal-nav .nav-links a {
        color: #c9c9c9; text-decoration: none; font-weight: 700; font-size: 14px;
        border-bottom: 2px solid transparent; padding: 4px 0;
      }
      nav.portal-nav .nav-links a:hover { color: var(--paper); }
      nav.portal-nav .nav-links a.active { color: var(--paper); border-bottom-color: var(--hr); }
      nav.portal-nav .nav-badge {
        font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px;
        letter-spacing: .08em; color: var(--hr); border: 1px solid var(--hr); padding: 4px 8px;
      }
      @media (max-width: 640px) {
        nav.portal-nav { height: auto; padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
        nav.portal-nav .nav-badge { display: none; }
      }
    </style>
  </head>
  <body>
    <nav class="portal-nav">
      <a class="brand" href="/">
        <svg class="logo" viewBox="0 0 101 96" role="img" aria-label="ACMEmailtrap" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="54" width="20" height="42" fill="#E63329" />
          <rect x="27" y="34" width="20" height="62" fill="#F6BE00" />
          <rect x="54" y="16" width="20" height="80" fill="#0057B8" />
          <rect x="81" y="0" width="20" height="96" fill="#1F9E5A" />
        </svg>
        <span class="wm"><b>ACMEMAILTRAP</b></span>
      </a>
      <span class="nav-links">
        <a href="/swagger.html" class="active">Swagger</a>
        <a href="/redoc.html">Redoc</a>
        <a href="/openapi.yaml">openapi.yaml</a>
        <a href="/">&larr; App</a>
      </span>
      <span class="nav-badge">API PORTAL</span>
    </nav>
    <div id="swagger-ui"></div>
    <script src="/webjars/swagger-ui/5.32.8/swagger-ui-bundle.js"></script>
    <script src="/webjars/swagger-ui/5.32.8/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: '/openapi.yaml',
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'StandaloneLayout',
          // send the session cookie so "Try it out" works when login is enabled
          withCredentials: true,
        })
      }
    </script>
  </body>
</html>
