<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACMEmailtrap API — Redoc</title>
    <style>
      /* ACMEsoftware portal header — self-contained (no CDN), mirrors the brand kit. */
      :root {
        --ink: #141414; --paper: #f5f4f0; --graphite-tint: #9aa0aa;
        --crm: #e63329; --hr: #f6be00; --supply: #1f9e5a; --build: #0057b8;
      }
      body { margin: 0; }
      nav.portal-nav {
        display: flex; align-items: center; gap: 20px;
        background: var(--ink); height: 60px; padding: 0 24px;
        font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      nav.portal-nav .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; margin-right: 6px; }
      nav.portal-nav .bars { display: flex; align-items: flex-end; gap: 2.5px; height: 22px; }
      nav.portal-nav .bars i { width: 5px; display: block; }
      nav.portal-nav .bars i:nth-child(1) { height: 9px;  background: var(--crm); }
      nav.portal-nav .bars i:nth-child(2) { height: 14px; background: var(--hr); }
      nav.portal-nav .bars i:nth-child(3) { height: 18px; background: var(--build); }
      nav.portal-nav .bars i:nth-child(4) { height: 22px; background: var(--supply); }
      nav.portal-nav .wm { display: flex; flex-direction: column; line-height: .8; }
      nav.portal-nav .wm b { font-size: 15px; letter-spacing: -0.04em; color: var(--paper); font-weight: 800; }
      nav.portal-nav .wm span { font-size: 6px; letter-spacing: 0.28em; color: var(--graphite-tint); padding-left: 0.28em; font-weight: 700; }
      nav.portal-nav .nav-links { display: flex; align-items: center; gap: 20px; flex: 1; }
      nav.portal-nav .nav-links a {
        color: #c9c9c9; text-decoration: none; font-weight: 700; font-size: 14px;
        border-bottom: 2px solid transparent; padding: 4px 0;
      }
      nav.portal-nav .nav-links a:hover { color: var(--paper); }
      nav.portal-nav .nav-links a.active { color: var(--paper); border-bottom-color: var(--hr); }
      nav.portal-nav .nav-badge {
        font-family: 'Space Mono', ui-monospace, monospace; font-size: 11px;
        letter-spacing: .08em; color: var(--hr); border: 1px solid var(--hr); padding: 4px 8px;
      }
      @media (max-width: 640px) {
        nav.portal-nav { height: auto; padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
        nav.portal-nav .nav-badge { display: none; }
      }
    </style>
  </head>
  <body>
    <nav class="portal-nav">
      <a class="brand" href="/">
        <span class="bars"><i></i><i></i><i></i><i></i></span>
        <span class="wm"><b>ACMEMAILTRAP</b><span>SMTP-FALLE</span></span>
      </a>
      <span class="nav-links">
        <a href="/swagger.html">Swagger</a>
        <a href="/redoc.html" class="active">Redoc</a>
        <a href="/openapi.yaml">openapi.yaml</a>
        <a href="/">&larr; App</a>
      </span>
      <span class="nav-badge">API PORTAL</span>
    </nav>
    <redoc spec-url="/openapi.yaml"></redoc>
    <!-- Self-contained bundle served from the jar (webjar), no CDN. -->
    <script src="/webjars/redoc/2.5.0/bundles/redoc.standalone.js"></script>
  </body>
</html>
