name: CLI native release

# Builds the standalone CLI as a GraalVM native binary per OS/arch and attaches it to the
# GitHub release for the tag. The binary starts in ~20ms, which matters for wait/extract in
# test loops. The portable fat jar (java -jar acmemailtrap-cli.jar) stays the fallback and is
# built by the normal CI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # upload release assets

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: acmemailtrap-cli-linux-x64
          - os: macos-14
            asset: acmemailtrap-cli-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only the CLI and the parent pom are needed; skip the frontend so no Node build runs.
      - name: Build native CLI
        run: ./mvnw -B -Pnative-image -pl cli -am -DskipTests -Dskip.frontend=true package

      - name: Stage binary
        run: |
          mkdir -p dist
          cp cli/target/acmemailtrap-cli "dist/${{ matrix.asset }}"
          # `amt` is just the same binary under a short name; ship both.
          cp cli/target/acmemailtrap-cli "dist/${{ matrix.asset }}-amt"
          ( cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256" )

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
