name: Docker publish

# Publishes acmesoftwaredotde/acmemailtrap to Docker Hub on version tags.
# Enable by setting repository variable PUBLISH_DOCKER=true and secrets
# DOCKERHUB_USERNAME + DOCKERHUB_TOKEN. Until then the job is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    if: ${{ vars.PUBLISH_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the jar stamps the commit

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Build the (architecture-independent) jar once, natively.
      - name: Build jars
        run: |
          ./mvnw -q -B -DskipTests package
          cp app/target/acmemailtrap.jar ./acmemailtrap.jar
          cp cli/target/acmemailtrap-cli.jar ./acmemailtrap-cli.jar

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: acmesoftwaredotde/acmemailtrap
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build amd64 into the local daemon so we can scan it before publishing.
      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64
          load: true
          tags: acmemailtrap:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acmemailtrap:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Scan passed: build + push the multi-arch image (cache reused from the scan build).
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
