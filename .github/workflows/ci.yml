name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # frontend-maven-plugin downloads its own pinned Node, but caching npm's
      # package store keeps `npm install` fast across runs.
      - name: Cache npm store
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('app/frontend/package-lock.json') }}
          restore-keys: npm-

      # Builds the React bundle (via the Maven frontend plugin), packages the jar
      # and runs the tests — the whole project in one command.
      - name: Build and test
        run: mvn -B verify

      # Continuous dependency vulnerability scan (informational; does not fail the build).
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: acmemailtrap-jar
          path: app/target/acmemailtrap.jar
          if-no-files-found: error
